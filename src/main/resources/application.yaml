spring:
  application:
    name: shortlink-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortlink}
    username: ${DB_USERNAME:shortlink}
    password: ${DB_PASSWORD:devpassword}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info